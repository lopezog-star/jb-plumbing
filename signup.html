<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up – J & B Plumbing</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="favicon.png">

    <style>
        body {
            margin: 0;
            font-family: 'Montserrat', sans-serif;
            background: #9BA3A8;
            color: #222;
        }

        header {
            background: #0a4d8c;
            color: white;
            padding: 40px 20px;
            text-align: center;
        }

        .section {
            width: 80%;
            margin: 40px auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0,0,0,0.08);
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        .submit-btn {
            margin-top: 25px;
            padding: 12px 28px;
            background: #0a4d8c;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }

        .submit-btn:hover {
            background: #083b6b;
        }

        .signin-link {
            display: block;
            margin-top: 20px;
            text-align: center;
            font-size: 1.1rem;
        }

        .signin-link a {
            color: #0a4d8c;
            font-weight: 600;
            text-decoration: none;
        }
    </style>
</head>

<body>

<header>
    <h1>Create an Account</h1>
</header>

<div class="section">
    <h2>Sign Up</h2>

    <label>First Name</label>
<input id="firstName" type="text" placeholder="John">

<label>Last Name</label>
<input id="lastName" type="text" placeholder="Doe">

    <label>Email</label>
    <input id="email" type="email" placeholder="you@example.com">

    <label>Phone Number</label>
    <input id="phone" type="tel" placeholder="(555) 123‑4567">

    <label>Password</label>
    <input type="password" placeholder="Create a password">

    <button class="submit-btn" onclick="createAccount()">
    Create Account
    </button>
</button>
    <div style="text-align:center; margin-top:20px; font-size:1.1rem;">
    <a href="verification.html" style="color:#0a4d8c; font-weight:600; text-decoration:none;">
        Continue to verification
    </a>
</div>

    <div class="signin-link">
        <a href="signin.html">Already have an account? Sign in</a>
    </div>
</div>
<script>
function createAccount() {

    const firstName =
        document.getElementById("firstName").value;

    const lastName =
        document.getElementById("lastName").value;

    const email =
        document.getElementById("email").value;

    const phone =
        document.getElementById("phone").value;

    localStorage.setItem("firstName", firstName);
    localStorage.setItem("lastName", lastName);
    localStorage.setItem("email", email);
    localStorage.setItem("phone", phone);

    localStorage.setItem(
        "joinDate",
        Date.now()
    );

    window.location.href = "verification.html";
}
</script>
</body>
</html>
