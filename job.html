<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visit Details – J & B Plumbing</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="favicon.png">

    <style>
        body {
            margin: 0;
            font-family: 'Montserrat', sans-serif;
            background: #9BA3A8;
            color: #222;
        }

        header {
            background: #0a4d8c;
            color: white;
            padding: 40px 20px;
            text-align: center;
        }

        nav {
            background: #083b6b;
            padding: 12px;
            text-align: center;
        }

        nav a {
            color: white;
            margin: 0 20px;
            text-decoration: none;
            font-weight: 500;
            font-size: 15px;
        }

        nav a:hover {
            color: #ffdd57;
            text-decoration: underline;
        }

        .section {
            width: 80%;
            margin: 40px auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0,0,0,0.08);
        }

        label {
            font-weight: 600;
            display: block;
            margin-top: 20px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        .submit-btn {
            margin-top: 30px;
            padding: 12px 28px;
            background: #0a4d8c;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }

        .submit-btn:hover {
            background: #083b6b;
        }
    </style>
</head>

<body>

<header>
    <h1>Visit Details</h1>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="mission.html">Our Mission</a>
    <a href="index.html#about">About</a>
    <a href="index.html#services">Services</a>
    <a href="index.html#contact">Contact</a>
</nav>

<div class="section">
    <h2>Enter Your Visit Information</h2>

    <form action="pay.html" method="GET">
        <label>Date of Visit</label>
        <input type="date" name="date" required>

        <label>Exact Service</label>
        <select name="service" required>
            <option value="">Select a service...</option>
            <option>Leak Repair</option>
            <option>Water Heater Installation</option>
            <option>Drain Cleaning</option>
            <option>Pipe Replacement</option>
            <option>Fixture Installation</option>
            <option>Emergency Service</option>
        </select>

        <label>Team Member</label>
        <select name="tech" required>
            <option value="">Select technician...</option>
            <option>John</option>
            <option>Brandon</option>
            <option>Mike</option>
            <option>Sarah</option>
        </select>

        <button class="submit-btn">Continue to Payment</button>
    </form>
</div>

</body>
</html>
