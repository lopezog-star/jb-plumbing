<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visit Details – J & B Plumbing</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="favicon.png">

    <style>
        body {
            margin: 0;
            font-family: 'Montserrat', sans-serif;
            background: #9BA3A8;
            color: #222;
        }

        header {
            background: #0a4d8c;
            color: white;
            padding: 40px 20px;
            text-align: center;
        }

        nav {
            background: #083b6b;
            padding: 12px;
            text-align: center;
        }

        nav a {
            color: white;
            margin: 0 20px;
            text-decoration: none;
            font-weight: 500;
            font-size: 15px;
        }

        nav a:hover {
            color: #ffdd57;
            text-decoration: underline;
        }

        .section {
            width: 80%;
            margin: 40px auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0,0,0,0.08);
        }

        label {
            font-weight: 600;
            display: block;
            margin-top: 20px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        .submit-btn {
            margin-top: 30px;
            padding: 12px 28px;
            background: #0a4d8c;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }

        .submit-btn:hover {
            background: #083b6b;
        }
    </style>
</head>

<body>

<header>
    <div style="position:absolute; top:20px; right:20px;">
    <a href="signin.html" 
       style="color:white; font-weight:600; font-size:1.1rem; text-decoration:none;">
       Sign In
    </a>
</div>
    <h1>Visit Details</h1>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="mission.html">Our Mission</a>
    <a href="index.html#about">About</a>
    <a href="index.html#services">Services</a>
    <a href="index.html#contact">Contact</a>
</nav>

<div class="section">
    <a href="index.html" style="font-size:18px; font-weight:700; color:#0a4d8c; text-decoration:none;">&lt; Back</a>
    <h2>Enter Your Visit Information</h2>

    <form action="pay.html" method="GET">
        <label>Date of Visit</label>
        <input type="date" name="date" required>

        <label>Exact Service</label>
        <label>Exact Service</label>

        <div style="margin-top:10px;">
    <label><input type="checkbox" name="service" value="Leak Repair"> Leak Repair</label><br>
    <label><input type="checkbox" name="service" value="Water Heater Installation"> Water Heater Installation</label><br>
    <label><input type="checkbox" name="service" value="Drain Cleaning"> Drain Cleaning</label><br>
    <label><input type="checkbox" name="service" value="Pipe Replacement"> Pipe Replacement</label><br>
    <label><input type="checkbox" name="service" value="Fixture Installation"> Fixture Installation</label><br>
    <label><input type="checkbox" name="service" value="Emergency Service"> Emergency Service</label>
</div>

        <label>Team Member</label>
        <select name="tech" required>
            <option value="">Select technician...</option>
            <option>John</option>
            <option>Brandon</option>
            <option>Mike</option>
            <option>Sarah</option>
        </select>

        <button class="submit-btn">Continue to Payment</button>
    </form>
</div>

</body>
</html>
