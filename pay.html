<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment – J & B Plumbing</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="favicon.png">

    <style>
        body {
            margin: 0;
            font-family: 'Montserrat', sans-serif;
            background: #9BA3A8;
            color: #222;
        }

        header {
            background: #0a4d8c;
            color: white;
            padding: 40px 20px;
            text-align: center;
        }

        nav {
            background: #083b6b;
            padding: 12px;
            text-align: center;
        }

        nav a {
            color: white;
            margin: 0 20px;
            text-decoration: none;
            font-weight: 500;
            font-size: 15px;
        }

        nav a:hover {
            color: #ffdd57;
            text-decoration: underline;
        }

        .section {
            width: 80%;
            margin: 40px auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0,0,0,0.08);
        }

        .payment-option {
            margin-top: 20px;
            font-weight: 700;
            cursor: pointer;
        }

        .dropdown {
            display: none;
            margin-top: 10px;
            padding: 20px;
            background: #f2f2f2;
            border-radius: 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
        }
    </style>

    <script>
        function toggle(id) {
            const box = document.getElementById(id);
            box.style.display = box.style.display === "block" ? "none" : "block";
        }
    </script>
</head>

<body>

<header>
    <div style="position:absolute; top:20px; right:20px;">
    <a href="signin.html" 
       style="color:white; font-weight:600; font-size:1.1rem; text-decoration:none;">
       Sign In
    </a>
</div>
    <h1>Payment Options</h1>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="mission.html">Our Mission</a>
    <a href="index.html#about">About</a>
    <a href="index.html#services">Services</a>
    <a href="index.html#contact">Contact</a>
</nav>

<div class="section">
    <a href="job.html" style="font-size:18px; font-weight:700; color:#0a4d8c; text-decoration:none;">&lt; Back</a>
    <h2>Select Your Payment Method</h2>
    <p style="font-size:20px; font-weight:700; margin-top:10px;">
    Amount Due: <span style="color:#0a4d8c;">$149.00</span>
</p>

    <div class="payment-option" onclick="toggle('apple')">Apple Pay</div>
    <div id="apple" class="dropdown">
        <label>Apple ID Email</label>
        <input type="email" placeholder="example@icloud.com">
    </div>

    <div class="payment-option" onclick="toggle('credit')">Credit Card</div>
    <div id="credit" class="dropdown">
        <label>Card Number</label>
        <input type="text" placeholder="1234 5678 9012 3456">

        <label>Expiration Date</label>
        <input type="text" placeholder="MM/YY">

        <label>CVV</label>
        <input type="text" placeholder="123">
    </div>

    <div class="payment-option" onclick="toggle('venmo')">Venmo</div>
    <div id="venmo" class="dropdown">
        <label>Venmo Username</label>
        <input type="text" placeholder="@username">
    </div>
</div>

</body>
</html>
