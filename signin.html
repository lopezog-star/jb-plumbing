<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In – J & B Plumbing</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="favicon.png">

    <style>
        body {
            margin: 0;
            font-family: 'Montserrat', sans-serif;
            background: #9BA3A8;
            color: #222;
        }

        header {
            background: #0a4d8c;
            color: white;
            padding: 40px 20px;
            text-align: center;
            position: relative;
        }

        .section {
            width: 80%;
            margin: 40px auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0,0,0,0.08);
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        .submit-btn {
            margin-top: 25px;
            padding: 12px 28px;
            background: #0a4d8c;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }

        .submit-btn:hover {
            background: #083b6b;
        }
    </style>
</head>

<body>

<header>
    <h1>Sign In</h1>
</header>

<div class="section">
    <h2>Account Login</h2>

    <label>Email</label>
    <input type="email" placeholder="you@example.com">

    <label>Password</label>
    <input type="password" placeholder="Enter your password">

    <button class="submit-btn">Sign In</button>
    <div style="text-align:center; margin-top:20px; font-size:1.1rem;">
    <a href="signup.html" style="color:#0a4d8c; font-weight:600; text-decoration:none;">
        Don't have an account? Sign up
    </a>
</div>
    <div style="text-align:center; margin-top:20px; font-size:1.1rem;">
    <a href="signup.html" style="color:#0a4d8c; font-weight:600; text-decoration:none;">
        Don't have an account? Sign up
    </a>
</div>

</body>
</html>
