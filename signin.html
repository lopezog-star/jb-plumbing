<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In – J & B Plumbing</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="favicon.png">

    <style>
        body {
            margin: 0;
            font-family: 'Montserrat', sans-serif;
            background: #9BA3A8;
            color: #222;
        }

        header {
            background: #0a4d8c;
            color: white;
            padding: 40px 20px;
            text-align: center;
        }

        .section {
            width: 80%;
            max-width: 500px;
            margin: 40px auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0,0,0,0.08);
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
            box-sizing: border-box;
        }

        .submit-btn {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 28px;
            background: red;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
        }

        .submit-btn:hover {
            background: #083b6b;
        }

        .signup-btn {
            background: #666;
        }

        .signup-btn:hover {
            background: #444;
        }

        .btn-container {
            text-align: center;
        }
    </style>
</head>

<body>

<header>
    <h1>Sign In</h1>
</header>

<div class="section">
    <h2>Account Login</h2>

    <label for="email">Email</label>
    <input id="email" type="email" placeholder="you@example.com">

    <label for="password">Password</label>
    <input id="password" type="password" placeholder="Enter your password">

    <div class="btn-container">
        <button class="submit-btn">Sign In</button>

        <br>

        <a href="signup.html" class="submit-btn signup-btn">
            Create Account
        </a>
    </div>
</div>

</body>
</html>
